<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Parashar</title>
  <desc id="desc">Quantitative research, economics, and machine learning systems</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f1f38"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93c5fd" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <g fill="none" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="2">
    <path d="M790 86 C855 35 916 169 982 103 S1080 69 1153 133"/>
    <path d="M765 211 C842 128 900 265 975 192 S1084 159 1160 222"/>
    <path d="M833 60 L874 183 L1008 78 L1056 221 L1132 104" stroke-opacity="0.18"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="790" cy="86" r="5" fill="#38bdf8"/>
    <circle cx="874" cy="123" r="7" fill="#60a5fa"/>
    <circle cx="982" cy="103" r="5" fill="#818cf8"/>
    <circle cx="1056" cy="116" r="7" fill="#a78bfa"/>
    <circle cx="1153" cy="133" r="5" fill="#c084fc"/>
    <circle cx="765" cy="211" r="4" fill="#38bdf8"/>
    <circle cx="874" cy="190" r="6" fill="#60a5fa"/>
    <circle cx="975" cy="192" r="5" fill="#818cf8"/>
    <circle cx="1056" cy="181" r="6" fill="#a78bfa"/>
    <circle cx="1160" cy="222" r="4" fill="#c084fc"/>
  </g>

  <rect x="70" y="63" width="76" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="137" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Aayush Parashar</text>
  <text x="73" y="184" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" letter-spacing="2.6">QUANTITATIVE RESEARCH · ECONOMICS · ML SYSTEMS</text>
  <text x="73" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Building models I can test, inspect, and explain.</text>
</svg>
